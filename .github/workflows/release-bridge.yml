name: Release Bridge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag with an empty draft GitHub Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bridge-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  validate-release:
    name: Validate draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub hides draft Releases from tokens without release write access.
      contents: write
    steps:
      - name: Require a version tag and empty draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = 0

  test:
    name: Test Bridge
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Run tests
        working-directory: bridge
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Build archive
        shell: bash
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentroom-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: Build desktop macOS/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            runner: macos-15
          - goarch: amd64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Test desktop shell
        working-directory: bridge
        run: go test -tags desktop ./cmd/agentroom-bridge-desktop

      - name: Build unsigned desktop archive
        shell: bash
        working-directory: bridge
        env:
          GOARCH: ${{ matrix.goarch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/package-desktop-darwin.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentroom-bridge-desktop-darwin-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach Bridge binaries
    needs: [build, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Require an empty draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: agentroom-bridge-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          version=${RELEASE_TAG#v}
          sha256sum \
            "agentroom-bridge_${version}_darwin_amd64.tar.gz" \
            "agentroom-bridge_${version}_darwin_arm64.tar.gz" \
            "agentroom-bridge_${version}_linux_amd64.tar.gz" \
            "agentroom-bridge_${version}_linux_arm64.tar.gz" \
            "agentroom-bridge_${version}_windows_amd64.zip" \
            "agentroom-bridge-desktop_${version}_darwin_amd64.zip" \
            "agentroom-bridge-desktop_${version}_darwin_arm64.zip" \
            > SHA256SUMS

      - name: Add top-level license assets
        run: cp LICENSE NOTICE COMMERCIAL-LICENSE.md dist/

      - name: Verify release assets before upload
        env:
          ASSET_DIR: ${{ github.workspace }}/dist
        run: ./bridge/scripts/verify-release-assets.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"

  verify-release:
    name: Verify uploaded Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft assets have the same visibility rule as the draft itself.
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Download draft Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" \
            --dir release-assets \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify uploaded Release assets
        env:
          ASSET_DIR: ${{ github.workspace }}/release-assets
        run: ./bridge/scripts/verify-release-assets.sh
