name: Release ConveneWire

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag with an empty draft GitHub Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bridge-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  validate-release:
    name: Validate draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve-source.outputs.source_sha }}
    permissions:
      # GitHub hides draft Releases from tokens without release write access.
      contents: write
    steps:
      - name: Resolve immutable Release source
        id: resolve-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          source_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Require an empty draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = 0

  repository-gates:
    name: Repository release gates
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum
            ops/convenewirectl/go.mod

      - name: Install locked dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run validate

      - name: Build workspaces
        run: npm run build

      - name: Run workspace tests
        run: npm test

      - name: Run deterministic end-to-end tests
        run: npm run test:e2e

      - name: Lint documentation
        run: npm run lint:docs

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate central Compose deployment
        env:
          CONVENE_WIRE_DOMAIN: team.example.com
          CONVENE_WIRE_PUBLIC_ORIGIN: https://team.example.com:9443
          CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE: ./deploy/secrets/owner_recovery_token
        run: |
          npm run test:compose
          bash -n scripts/compose-backup.sh
          bash -n scripts/compose-restore.sh

  go-gates:
    name: Go release gates
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum
            ops/convenewirectl/go.mod

      - name: Test and vet Go contracts
        working-directory: packages/contracts
        run: |
          go test ./...
          go vet ./...

      - name: Test and vet Bridge
        working-directory: bridge
        run: |
          go test ./...
          go vet ./...

      - name: Test, vet, and build central controller
        working-directory: ops/convenewirectl
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/convenewirectl
          bash -n scripts/build-central-image.sh
          bash -n scripts/verify-central-image-docker.sh
          bash -n scripts/package-central-release.sh
          bash -n scripts/verify-central-release.sh

      - name: Package and verify Central source release
        env:
          RELEASE_TAG: v0.0.0-release-gate
          SOURCE_REF: HEAD
          OUTPUT_DIR: ${{ runner.temp }}/central-dist
        run: |
          ./ops/convenewirectl/scripts/package-central-release.sh
          ASSET_DIR="${OUTPUT_DIR}" \
            ./ops/convenewirectl/scripts/verify-central-release.sh

      - name: Check Bridge release scripts
        run: |
          bash -n bridge/scripts/package-release.sh
          bash -n bridge/scripts/package-desktop-darwin.sh
          bash -n bridge/scripts/verify-release-assets.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [validate-release, repository-gates, go-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Build archive
        shell: bash
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
        run: ./scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convenewire-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  central:
    name: Build Central source release
    needs: [validate-release, repository-gates, go-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ops/convenewirectl/go.mod
          cache-dependency-path: ops/convenewirectl/go.mod

      - name: Build checksum-pinned Central source archive
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
        run: ./ops/convenewirectl/scripts/package-central-release.sh

      - name: Upload Central artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convenewire-central-source
          path: |
            dist/*.tar.gz
            dist/*.SHA256SUMS.sha256
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: Build desktop macOS/arm64
    needs: [validate-release, repository-gates, go-gates]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Test desktop shell
        working-directory: bridge
        run: go test -tags desktop ./cmd/convenewire-bridge-desktop

      - name: Build unsigned desktop archive
        shell: bash
        working-directory: bridge
        env:
          GOARCH: arm64
          OUTPUT_DIR: ${{ github.workspace }}/dist
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
        run: ./scripts/package-desktop-darwin.sh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convenewire-bridge-desktop-darwin-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Build desktop Windows/amd64
    needs: [validate-release, repository-gates, go-gates]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum
            bridge/tools/windows-resources/go.sum

      - name: Test and check Windows product icon resources
        working-directory: bridge/tools/windows-resources
        shell: pwsh
        env:
          GOFLAGS: -gcflags=github.com/srwiley/rasterx=-d=fmahash=qn
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows resource tool tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows resource tool vet failed" }
          go run . -root $env:GITHUB_WORKSPACE -mode check
          if ($LASTEXITCODE -ne 0) { throw "Windows product resources are not reproducible" }

      - name: Test desktop shell
        working-directory: bridge
        shell: pwsh
        run: |
          ./scripts/test-windows-release-semver.ps1
          ./scripts/test-windows-desktop-icons.ps1
          ./scripts/test-windows-workflow-failures.ps1
          ./scripts/test-windows-silent-prerequisite.ps1
          ./scripts/test-windows-output-paths.ps1
          go test -tags desktop ./cmd/convenewire-bridge-desktop
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop tests failed" }
          go vet -tags desktop ./cmd/convenewire-bridge-desktop
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop vet failed" }

      - name: Download latest stable Windows installer
        id: previous-stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP "convenewire-desktop-previous"
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          $previousReleaseTag = (gh release view `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName `
            --jq .tagName).Trim()
          if (-not $previousReleaseTag -or $previousReleaseTag -eq $env:RELEASE_TAG) {
            throw "A distinct latest stable release is required for upgrade verification"
          }
          gh release download $previousReleaseTag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "convenewire-bridge-desktop_*_windows_amd64_setup.exe" `
            --dir $previousDir
          if ($LASTEXITCODE -ne 0) {
            throw "Previous stable Windows installer download failed"
          }
          $previousInstallers = @(Get-ChildItem `
            -LiteralPath $previousDir `
            -Filter "*_setup.exe")
          if ($previousInstallers.Count -ne 1) {
            throw "Expected exactly one previous stable Windows installer"
          }
          "release_tag=$previousReleaseTag" >> $env:GITHUB_OUTPUT
          "installer_path=$($previousInstallers[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and verify unsigned desktop packages
        working-directory: bridge
        shell: pwsh
        env:
          GOARCH: amd64
          OUTPUT_DIR: ${{ github.workspace }}/dist
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
          PREVIOUS_RELEASE_TAG: ${{ steps.previous-stable.outputs.release_tag }}
          PREVIOUS_INSTALLER_PATH: ${{ steps.previous-stable.outputs.installer_path }}
        run: |
          ./scripts/package-desktop-windows.ps1
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/verify-desktop-windows-installer.ps1 `
            -PreviousReleaseTag $env:PREVIOUS_RELEASE_TAG `
            -PreviousInstallerPath $env:PREVIOUS_INSTALLER_PATH `
            -ReleaseTag $env:RELEASE_TAG `
            -CandidateArchivePath (Join-Path $env:OUTPUT_DIR "convenewire-bridge-desktop_${version}_windows_amd64.zip") `
            -CandidateExecutablePath (Join-Path $env:OUTPUT_DIR "convenewire-bridge-desktop_${version}_windows_amd64\ConveneWire Bridge.exe") `
            -InstallerPath (Join-Path $env:OUTPUT_DIR "convenewire-bridge-desktop_${version}_windows_amd64_setup.exe")

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convenewire-bridge-desktop-windows-amd64
          path: |
            dist/*.zip
            dist/*_setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach ConveneWire binaries
    needs: [validate-release, build, central, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Reconfirm immutable tag source before upload
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          TAG_SOURCE_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)
          export TAG_SOURCE_SHA
          node ./scripts/qa/verify-release-workflow.mjs assert-tag-source

      - name: Require an empty draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: convenewire-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          version=${RELEASE_TAG#v}
          sha256sum \
            "convenewire-bridge_${version}_linux_amd64.tar.gz" \
            "convenewire-bridge_${version}_linux_arm64.tar.gz" \
            "convenewire-bridge-desktop_${version}_darwin_arm64.zip" \
            "convenewire-bridge-desktop_${version}_windows_amd64.zip" \
            "convenewire-bridge-desktop_${version}_windows_amd64_setup.exe" \
            "convenewire-central_${version}_source.tar.gz" \
            "convenewire-central_${version}_source.SHA256SUMS.sha256" \
            > SHA256SUMS

      - name: Add top-level license assets
        run: cp LICENSE NOTICE COMMERCIAL-LICENSE.md TRADEMARKS.md dist/

      - name: Verify release assets before upload
        env:
          ASSET_DIR: ${{ github.workspace }}/dist
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
        run: ./bridge/scripts/verify-release-assets.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"

  verify-release:
    name: Verify uploaded Release
    needs: [validate-release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft assets have the same visibility rule as the draft itself.
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.source_sha }}

      - name: Reconfirm immutable tag source before download verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          TAG_SOURCE_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)
          export TAG_SOURCE_SHA
          node ./scripts/qa/verify-release-workflow.mjs assert-tag-source

      - name: Download draft Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" \
            --dir release-assets \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify uploaded Release assets
        env:
          ASSET_DIR: ${{ github.workspace }}/release-assets
          SOURCE_REF: ${{ needs.validate-release.outputs.source_sha }}
        run: ./bridge/scripts/verify-release-assets.sh
