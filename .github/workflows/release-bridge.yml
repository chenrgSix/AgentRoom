name: Release Bridge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bridge-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  test:
    name: Test Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Run tests
        working-directory: bridge
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            format: tar.gz
          - goos: windows
            goarch: amd64
            format: zip
          - goos: linux
            goarch: amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            format: tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Build archive
        shell: bash
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Release tag must contain only letters, numbers, dots, underscores, and hyphens" >&2
            exit 1
          fi

          package="agentroom-bridge_${version}_${GOOS}_${GOARCH}"
          staging="../dist/${package}"
          binary="agentroom-bridge"
          if [[ "${GOOS}" == "windows" ]]; then
            binary="agentroom-bridge.exe"
          fi

          mkdir -p "${staging}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
            -o "${staging}/${binary}" \
            ./cmd/agentroom-bridge
          cp README.md "${staging}/README.md"

          cd ../dist
          if [[ "${ARCHIVE_FORMAT}" == "zip" ]]; then
            zip -qr "${package}.zip" "${package}"
          else
            tar -czf "${package}.tar.gz" "${package}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentroom-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach Bridge binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: agentroom-bridge-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum agentroom-bridge_* > SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
