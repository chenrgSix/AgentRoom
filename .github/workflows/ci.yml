name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum
            ops/convenewirectl/go.mod

      - name: Install locked dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run validate

      - name: Build workspaces
        run: npm run build

      - name: Run workspace tests
        run: npm test

      - name: Run deterministic end-to-end tests
        run: npm run test:e2e

      - name: Lint documentation
        run: npm run lint:docs

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate central Compose deployment
        env:
          CONVENE_WIRE_DOMAIN: team.example.com
          CONVENE_WIRE_PUBLIC_ORIGIN: https://team.example.com:9443
          CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE: ./deploy/secrets/owner_recovery_token
        run: |
          npm run test:compose
          bash -n scripts/compose-backup.sh
          bash -n scripts/compose-restore.sh

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum
            ops/convenewirectl/go.mod

      - name: Test and vet Go contracts
        working-directory: packages/contracts
        run: |
          go test ./...
          go vet ./...

      - name: Test and vet Bridge
        working-directory: bridge
        run: |
          go test ./...
          go vet ./...

      - name: Test, vet, and build central controller
        working-directory: ops/convenewirectl
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/convenewirectl
          bash -n scripts/build-central-image.sh
          bash -n scripts/verify-central-image-docker.sh
          bash -n scripts/package-central-release.sh
          bash -n scripts/verify-central-release.sh

      - name: Package and verify Central release matrix
        env:
          RELEASE_TAG: v0.0.0-ci
          SOURCE_REF: HEAD
          OUTPUT_DIR: ${{ runner.temp }}/central-dist
          CENTRAL_RELEASE_SCHEMA: 1
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} \
              ./ops/convenewirectl/scripts/package-central-release.sh
          done
          ASSET_DIR="${OUTPUT_DIR}" \
            ./ops/convenewirectl/scripts/verify-central-release.sh

      - name: Check Bridge release scripts
        run: |
          bash -n bridge/scripts/package-release.sh
          bash -n bridge/scripts/package-desktop-darwin.sh
          bash -n bridge/scripts/verify-release-assets.sh

  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Test, vet, and build desktop shell
        working-directory: bridge
        run: |
          go test -tags desktop ./cmd/convenewire-bridge-desktop
          go vet -tags desktop ./cmd/convenewire-bridge-desktop
          go build -tags desktop ./cmd/convenewire-bridge-desktop

  desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: |
            bridge/go.sum
            packages/contracts/go.sum

      - name: Test, vet, and package desktop shell
        working-directory: bridge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "convenewire-desktop-windows"
          $previousDir = Join-Path $env:RUNNER_TEMP "convenewire-desktop-previous"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          $previousReleaseTag = (gh release view `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName `
            --jq .tagName).Trim()
          gh release download $previousReleaseTag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "convenewire-bridge-desktop_*_windows_amd64_setup.exe" `
            --dir $previousDir
          if ($LASTEXITCODE -ne 0) {
            throw "Previous stable Windows installer download failed"
          }
          $previousInstallers = @(Get-ChildItem `
            -LiteralPath $previousDir `
            -Filter "*_setup.exe")
          if ($previousInstallers.Count -ne 1) {
            throw "Expected exactly one previous stable Windows installer"
          }
          ./scripts/test-windows-release-semver.ps1
          go test ./... -run Windows
          go test -tags desktop ./cmd/convenewire-bridge-desktop
          go vet -tags desktop ./cmd/convenewire-bridge-desktop
          ./scripts/package-desktop-windows.ps1 `
            -ReleaseTag v999.0.0-ci `
            -SourceRef $env:GITHUB_SHA `
            -GoArch amd64 `
            -OutputDir $outputDir
          ./scripts/verify-desktop-windows-installer.ps1 `
            -PreviousReleaseTag $previousReleaseTag `
            -PreviousInstallerPath $previousInstallers[0].FullName `
            -ReleaseTag v999.0.0-ci `
            -CandidateArchivePath (Join-Path $outputDir "convenewire-bridge-desktop_999.0.0-ci_windows_amd64.zip") `
            -CandidateExecutablePath (Join-Path $outputDir "convenewire-bridge-desktop_999.0.0-ci_windows_amd64\ConveneWire Bridge.exe") `
            -InstallerPath (Join-Path $outputDir "convenewire-bridge-desktop_999.0.0-ci_windows_amd64_setup.exe")

      - name: Upload Windows package smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: convenewire-bridge-desktop-windows-ci
          path: |
            ${{ runner.temp }}/convenewire-desktop-windows/*.zip
            ${{ runner.temp }}/convenewire-desktop-windows/*_setup.exe
          if-no-files-found: error
          retention-days: 3
