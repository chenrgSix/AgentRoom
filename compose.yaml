name: agentroom

services:
  secret-init:
    image: ${CONVENE_WIRE_SERVER_IMAGE:-convenewire/server:${CONVENE_WIRE_IMAGE_TAG:-${AGENT_ROOM_IMAGE_TAG:-source-build}}}
    pull_policy: never
    command:
      - node
      - -e
      - |
        const fs = require("node:fs");
        for (const suffix of [
          "BIND_ADDRESS", "BRIDGE_SERVER_TOKEN", "BROWSER_ORIGIN", "CADDY_HTTP_PROFILE_FILE",
          "CADDY_PKI_PROFILE_FILE", "CADDY_TLS_PROFILE_FILE", "DATABASE_PATH", "DEPLOYMENT_TRUST_FILE",
          "DEPLOYMENT_TRUST_ROTATION_FILE", "DOMAIN", "HTTPS_PORT", "HTTP_PORT",
          "IMAGE_TAG", "LOG_MAX_FILES", "LOG_MAX_SIZE",
          "OWNER_RECOVERY_TOKEN_FILE", "PUBLIC_ORIGIN"
        ]) {
          const current = process.env[`CONVENE_WIRE_$${suffix}`]?.trim();
          const legacy = process.env[`AGENT_ROOM_$${suffix}`]?.trim();
          if (current && legacy && current !== legacy) {
            throw new Error(`CONVENE_WIRE_$${suffix} conflicts with legacy AGENT_ROOM_$${suffix}`);
          }
        }
        const source = "/source/owner_recovery_token";
        const target = "/prepared/owner_recovery_token";
        const value = fs.readFileSync(source, "utf8").trim();
        if (value.length < 32 || value.length > 512) {
          throw new Error("Owner recovery token must contain 32 to 512 characters");
        }
        const temporary = `$${target}.tmp`;
        fs.writeFileSync(temporary, `$${value}\n`, { mode: 0o444 });
        fs.chmodSync(temporary, 0o444);
        fs.renameSync(temporary, target);
    network_mode: none
    environment:
      AGENT_ROOM_BIND_ADDRESS: ${AGENT_ROOM_BIND_ADDRESS:-}
      AGENT_ROOM_BRIDGE_SERVER_TOKEN: ${AGENT_ROOM_BRIDGE_SERVER_TOKEN:-}
      AGENT_ROOM_CADDY_PKI_PROFILE_FILE: ${AGENT_ROOM_CADDY_PKI_PROFILE_FILE:-}
      AGENT_ROOM_CADDY_TLS_PROFILE_FILE: ${AGENT_ROOM_CADDY_TLS_PROFILE_FILE:-}
      AGENT_ROOM_DATABASE_PATH: ${AGENT_ROOM_DATABASE_PATH:-}
      AGENT_ROOM_DEPLOYMENT_TRUST_FILE: ${AGENT_ROOM_DEPLOYMENT_TRUST_FILE:-}
      AGENT_ROOM_DEPLOYMENT_TRUST_ROTATION_FILE: ${AGENT_ROOM_DEPLOYMENT_TRUST_ROTATION_FILE:-}
      AGENT_ROOM_DOMAIN: ${AGENT_ROOM_DOMAIN:-}
      AGENT_ROOM_HTTPS_PORT: ${AGENT_ROOM_HTTPS_PORT:-}
      AGENT_ROOM_HTTP_PORT: ${AGENT_ROOM_HTTP_PORT:-}
      AGENT_ROOM_IMAGE_TAG: ${AGENT_ROOM_IMAGE_TAG:-}
      AGENT_ROOM_LOG_MAX_FILES: ${AGENT_ROOM_LOG_MAX_FILES:-}
      AGENT_ROOM_LOG_MAX_SIZE: ${AGENT_ROOM_LOG_MAX_SIZE:-}
      AGENT_ROOM_OWNER_RECOVERY_TOKEN_FILE: ${AGENT_ROOM_OWNER_RECOVERY_TOKEN_FILE:-}
      AGENT_ROOM_PUBLIC_ORIGIN: ${AGENT_ROOM_PUBLIC_ORIGIN:-}
      CONVENE_WIRE_BIND_ADDRESS: ${CONVENE_WIRE_BIND_ADDRESS:-}
      CONVENE_WIRE_BRIDGE_SERVER_TOKEN: ${CONVENE_WIRE_BRIDGE_SERVER_TOKEN:-}
      CONVENE_WIRE_BROWSER_ORIGIN: ${CONVENE_WIRE_BROWSER_ORIGIN:-}
      CONVENE_WIRE_CADDY_HTTP_PROFILE_FILE: ${CONVENE_WIRE_CADDY_HTTP_PROFILE_FILE:-}
      CONVENE_WIRE_CADDY_PKI_PROFILE_FILE: ${CONVENE_WIRE_CADDY_PKI_PROFILE_FILE:-}
      CONVENE_WIRE_CADDY_TLS_PROFILE_FILE: ${CONVENE_WIRE_CADDY_TLS_PROFILE_FILE:-}
      CONVENE_WIRE_DATABASE_PATH: ${CONVENE_WIRE_DATABASE_PATH:-}
      CONVENE_WIRE_DEPLOYMENT_TRUST_FILE: ${CONVENE_WIRE_DEPLOYMENT_TRUST_FILE:-}
      CONVENE_WIRE_DEPLOYMENT_TRUST_ROTATION_FILE: ${CONVENE_WIRE_DEPLOYMENT_TRUST_ROTATION_FILE:-}
      CONVENE_WIRE_DOMAIN: ${CONVENE_WIRE_DOMAIN:-}
      CONVENE_WIRE_HTTPS_PORT: ${CONVENE_WIRE_HTTPS_PORT:-}
      CONVENE_WIRE_HTTP_PORT: ${CONVENE_WIRE_HTTP_PORT:-}
      CONVENE_WIRE_IMAGE_TAG: ${CONVENE_WIRE_IMAGE_TAG:-}
      CONVENE_WIRE_LOG_MAX_FILES: ${CONVENE_WIRE_LOG_MAX_FILES:-}
      CONVENE_WIRE_LOG_MAX_SIZE: ${CONVENE_WIRE_LOG_MAX_SIZE:-}
      CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE: ${CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE:-}
      CONVENE_WIRE_PUBLIC_ORIGIN: ${CONVENE_WIRE_PUBLIC_ORIGIN:-}
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "0:0"
    volumes:
      - type: bind
        source: ${CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE:-${AGENT_ROOM_OWNER_RECOVERY_TOKEN_FILE:-./deploy/secrets/owner_recovery_token}}
        target: /source/owner_recovery_token
        read_only: true
      - agentroom_secrets:/prepared

  data-init:
    image: ${CONVENE_WIRE_SERVER_IMAGE:-convenewire/server:${CONVENE_WIRE_IMAGE_TAG:-${AGENT_ROOM_IMAGE_TAG:-source-build}}}
    pull_policy: never
    command:
      - node
      - -e
      - |
        const fs = require("node:fs");
        const node = fs.readFileSync("/etc/passwd", "utf8")
          .split("\n")
          .find((line) => line.startsWith("node:"));
        if (!node) throw new Error("Container node account is missing");
        const fields = node.split(":");
        for (const path of ["/data", "/backups"]) {
          fs.chownSync(path, Number(fields[2]), Number(fields[3]));
          fs.chmodSync(path, 0o700);
        }
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "0:0"
    volumes:
      - agentroom_data:/data
      - agentroom_backups:/backups

  agentroom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONVENE_WIRE_RELEASE_VERSION: ${CONVENE_WIRE_RELEASE_VERSION:-development}
        CONVENE_WIRE_SOURCE_COMMIT: ${CONVENE_WIRE_SOURCE_COMMIT:-unknown}
    cap_drop:
      - ALL
    depends_on:
      data-init:
        condition: service_completed_successfully
      secret-init:
        condition: service_completed_successfully
    environment:
      AGENT_ROOM_BRIDGE_SERVER_TOKEN: ${AGENT_ROOM_BRIDGE_SERVER_TOKEN:-}
      AGENT_ROOM_DATABASE_PATH: ${AGENT_ROOM_DATABASE_PATH:-}
      AGENT_ROOM_DEPLOYMENT_TRUST_FILE: ${AGENT_ROOM_DEPLOYMENT_TRUST_FILE:-}
      AGENT_ROOM_DEPLOYMENT_TRUST_ROTATION_FILE: ${AGENT_ROOM_DEPLOYMENT_TRUST_ROTATION_FILE:-}
      AGENT_ROOM_HOST: ${AGENT_ROOM_HOST:-}
      AGENT_ROOM_MEMORY_REDUCER: ${AGENT_ROOM_MEMORY_REDUCER:-}
      AGENT_ROOM_PORT: ${AGENT_ROOM_PORT:-}
      AGENT_ROOM_PUBLIC_ORIGIN: ${AGENT_ROOM_PUBLIC_ORIGIN:-}
      AGENT_ROOM_TRUST_PROXY_HOPS: ${AGENT_ROOM_TRUST_PROXY_HOPS:-}
      AGENT_ROOM_WEB_AUTH_MODE: ${AGENT_ROOM_WEB_AUTH_MODE:-}
      AGENT_ROOM_WEB_ROOT: ${AGENT_ROOM_WEB_ROOT:-}
      CONVENE_WIRE_BRIDGE_SERVER_TOKEN: ${CONVENE_WIRE_BRIDGE_SERVER_TOKEN:-${AGENT_ROOM_BRIDGE_SERVER_TOKEN:-}}
      CONVENE_WIRE_BROWSER_ORIGIN: ${CONVENE_WIRE_BROWSER_ORIGIN:-}
      CONVENE_WIRE_DATABASE_PATH: ${CONVENE_WIRE_DATABASE_PATH:-${AGENT_ROOM_DATABASE_PATH:-/data/agent-room.sqlite}}
      CONVENE_WIRE_RELEASE_VERSION: ${CONVENE_WIRE_RELEASE_VERSION:-development}
      CONVENE_WIRE_SOURCE_COMMIT: ${CONVENE_WIRE_SOURCE_COMMIT:-unknown}
      CONVENE_WIRE_DEPLOYMENT_TRUST_FILE: ${CONVENE_WIRE_DEPLOYMENT_TRUST_FILE:-${AGENT_ROOM_DEPLOYMENT_TRUST_FILE:-}}
      CONVENE_WIRE_DEPLOYMENT_TRUST_ROTATION_FILE: ${CONVENE_WIRE_DEPLOYMENT_TRUST_ROTATION_FILE:-${AGENT_ROOM_DEPLOYMENT_TRUST_ROTATION_FILE:-}}
      CONVENE_WIRE_HOST: ${CONVENE_WIRE_HOST:-${AGENT_ROOM_HOST:-0.0.0.0}}
      CONVENE_WIRE_MEMORY_REDUCER: ${CONVENE_WIRE_MEMORY_REDUCER:-${AGENT_ROOM_MEMORY_REDUCER:-}}
      CONVENE_WIRE_OWNER_RECOVERY_TOKEN_FILE: /run/secrets/owner_recovery_token
      CONVENE_WIRE_PORT: ${CONVENE_WIRE_PORT:-${AGENT_ROOM_PORT:-3000}}
      CONVENE_WIRE_PUBLIC_ORIGIN: ${CONVENE_WIRE_PUBLIC_ORIGIN:-${AGENT_ROOM_PUBLIC_ORIGIN:-}}
      CONVENE_WIRE_TRUST_PROXY_HOPS: ${CONVENE_WIRE_TRUST_PROXY_HOPS:-${AGENT_ROOM_TRUST_PROXY_HOPS:-1}}
      CONVENE_WIRE_WEB_AUTH_MODE: ${CONVENE_WIRE_WEB_AUTH_MODE:-${AGENT_ROOM_WEB_AUTH_MODE:-trusted-team}}
      CONVENE_WIRE_WEB_ROOT: ${CONVENE_WIRE_WEB_ROOT:-${AGENT_ROOM_WEB_ROOT:-/app/apps/web/dist}}
    image: ${CONVENE_WIRE_SERVER_IMAGE:-convenewire/server:${CONVENE_WIRE_IMAGE_TAG:-${AGENT_ROOM_IMAGE_TAG:-source-build}}}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    init: true
    logging:
      driver: json-file
      options:
        max-file: "${CONVENE_WIRE_LOG_MAX_FILES:-${AGENT_ROOM_LOG_MAX_FILES:-5}}"
        max-size: "${CONVENE_WIRE_LOG_MAX_SIZE:-${AGENT_ROOM_LOG_MAX_SIZE:-10m}}"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    volumes:
      - agentroom_data:/data
      - agentroom_backups:/backups
      - agentroom_secrets:/run/secrets:ro

  caddy:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    image: ${CONVENE_WIRE_CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    depends_on:
      agentroom:
        condition: service_healthy
    environment:
      CONVENE_WIRE_DOMAIN: ${CONVENE_WIRE_DOMAIN:-${AGENT_ROOM_DOMAIN:-}}
      CONVENE_WIRE_PUBLIC_ORIGIN: ${CONVENE_WIRE_PUBLIC_ORIGIN:-${AGENT_ROOM_PUBLIC_ORIGIN:-}}
    logging:
      driver: json-file
      options:
        max-file: "${CONVENE_WIRE_LOG_MAX_FILES:-${AGENT_ROOM_LOG_MAX_FILES:-5}}"
        max-size: "${CONVENE_WIRE_LOG_MAX_SIZE:-${AGENT_ROOM_LOG_MAX_SIZE:-10m}}"
    ports:
      - "${CONVENE_WIRE_BIND_ADDRESS:-${AGENT_ROOM_BIND_ADDRESS:-0.0.0.0}}:${CONVENE_WIRE_HTTP_PORT:-${AGENT_ROOM_HTTP_PORT:-80}}:80"
      - "${CONVENE_WIRE_BIND_ADDRESS:-${AGENT_ROOM_BIND_ADDRESS:-0.0.0.0}}:${CONVENE_WIRE_HTTPS_PORT:-${AGENT_ROOM_HTTPS_PORT:-9443}}:443"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/app.caddy:/etc/caddy/app-profile.caddy:ro
      - ${CONVENE_WIRE_CADDY_HTTP_PROFILE_FILE:-./deploy/http/redirect.caddy}:/etc/caddy/http-profile.caddy:ro
      - ${CONVENE_WIRE_CADDY_TLS_PROFILE_FILE:-${AGENT_ROOM_CADDY_TLS_PROFILE_FILE:-./deploy/tls/public-ca.caddy}}:/etc/caddy/tls-profile.caddy:ro
      - ${CONVENE_WIRE_CADDY_PKI_PROFILE_FILE:-${AGENT_ROOM_CADDY_PKI_PROFILE_FILE:-./deploy/tls/pki-none.caddy}}:/etc/caddy/pki-profile.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  agentroom_backups:
  agentroom_data:
  agentroom_secrets:
  caddy_config:
  caddy_data:
